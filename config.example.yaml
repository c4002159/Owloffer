# BossHunter 配置文件
# 复制此文件为 config.yaml 并修改为你的实际配置

profile:
  resume_path: "./resume.md"
  # 用于校招/社招岗位筛选与 AI 评分；留空保持旧行为。
  education: ""
  recruitment_type: ""  # campus / experienced / both
  ai_greeting_enabled: true  # 关闭后使用下面的固定招呼语，不调用 AI 生成或优化
  fixed_greeting: ""  # 关闭 AI 时必填，最多 300 字；发送仍需人工确认
  greeting_preference: ""  # 只补充招呼语语气与内容偏好，不覆盖事实和安全规则
  resume_output_dir: "./data/resumes"
  target_roles: ["你的目标岗位1", "目标岗位2", "目标岗位3"]
  target_cities: ["北京"]
  salary_min: 15  # K
  salary_max: 25  # K
  salary_ceil_ratio: 1.5  # 岗位薪资下限超过 salary_max × 该倍数时过滤
  filter_unparsed_salary: true  # 过滤面议或无法解析薪资的岗位
  allow_internship: false  # 开启时自动关闭 filter_unparsed_salary，避免日薪实习被误过滤
  deal_breakers: ["外包", "996"]
  jd_deal_breakers: []  # 示例：需要排除完整 JD 中的词时再填写
  blocked_companies: [] # 示例：不希望采集的公司名称或关键词
  max_job_age_days: 0 # 岗位首次被采集超过 N 天则过滤；0 = 关闭（网页版没有发布时间，用首次采集时间近似）
  max_job_update_days: 30 # 平台上岗位超过 N 天未更新则过滤（51job/猎聘读取；读不到更新时间的不拦）；0 = 关闭
  hr_active_min_level: 0 # HR 活跃度下限：0 关闭，1 一个月内，2 三天内，3 在线/今日活跃
  hr_active_unknown_pass: true # 读不到 HR 活跃度时是否放行
  # 可选：个人亮点（用于招呼语生成）
  extra_highlights:
    - "你的核心竞争力描述"
  # 可选：在线作品集链接
  portfolio_url: ""

search:
  keywords: ["关键词1", "关键词2"]
  cities: ["北京"]
  city_codes: {}  # 自定义城市名称 -> 平台城市编码，由配置页自动填写
  max_pages: 5
  sort: newest

collection:
  default_order: [boss]
  auto_score_default: false
  # 以下页面额度只统计 BOSS 直聘；智联和 51job 不占用。
  daily_search_page_limit: 60     # BOSS 单日搜索页上限
  daily_detail_page_limit: 900    # BOSS 单日详情页尝试上限
  max_consecutive_page_failures: 3
  risk_pause_min_minutes: 5       # BOSS 风险信号后随机暂停下限
  risk_pause_max_minutes: 10      # BOSS 风险信号后随机暂停上限
  collection_delay_multiplier: 1.5 # BOSS 采集等待时间倍数
  delivery_cooldown_min_minutes: 5   # BOSS 采集结束到 BOSS 投递的随机冷却下限
  delivery_cooldown_max_minutes: 15  # BOSS 采集结束到 BOSS 投递的随机冷却上限

platforms:
  boss:
    enabled: true
    search:
      keywords: ["关键词1", "关键词2"]
      cities: ["北京"]
      city_codes: {}
      max_pages: 5
      sort: newest
  zhilian:
    enabled: false
    search:
      keywords: []
      cities: []
      # 只需填写城市名称；BossHunter 会从内置智联目录自动匹配城市编码。
      city_codes: {}
      max_pages: 3
      sort: default
  51job:
    enabled: false
    # 51job 目前只开放采集/评分/招呼语生成，真实发送和监听仍锁定。
    search:
      keywords: []
      cities: ["上海"]
      city_codes: {"上海": "020000"}
      max_pages: 1
      sort: default
  liepin:
    enabled: false
    # 猎聘目前只开放采集/评分/招呼语生成，真实发送和监听仍锁定。
    search:
      keywords: []
      cities: []
      # 只需填写城市名称；BossHunter 会从内置猎聘目录自动匹配城市编码。
      city_codes: {}
      max_pages: 1
      sort: default

scoring:
  threshold: 70
  max_candidates: 20
  min_match_score: 0 # 匹配度门槛：低于它的岗位不进审查列表（0 = 关闭，建议 50）；匹配度只衡量和你经历的契合度
  min_activity_score: 0 # 活跃度门槛（0-100）：衡量岗位像不像真在招，低于它的不进审查列表（0 = 关闭）

automation:
  auto_send: false # 默认关闭：岗位先进审查窗口，由你确认后才发送
  review_cap: 150 # 待审查加已通过未发送的岗位达到该数量时，评分暂停
  # 猎聘投递选简历：通过猎聘的“简历预览”读取账号里每份附件简历，用 AI 打标签并记住，再与岗位标题和描述的标签匹配，选分数最高的；
  # 分数低于下面的阈值就不投，降级为打招呼；分数接近时优先用猎聘预选的那份。
  resume_match_min_score: 0.2
  resume_refresh_hours: 12 # 隔多少小时重新检查猎聘里的附件简历有没有新增或更换（启动时、定时、猎聘投递前都会检查）
  keyword_budget: true # 采集按关键词梯队分配预算（核心 > 扩展 > 探索），并按采集结果自动升降梯队
  external_greeting_send: false # 仅控制“猎聘投简历成功之后，再在聊天里追发一条定制招呼语”（会与账号默认问候并存）；没有投简历入口或没有合适简历时，自动降级为发招呼语，不受这个开关影响
  review_min_score: 60 # 综合分达到该值才进入审查窗口
  company_cooldown_days: 1 # 同一公司通过/发送后几天内不再出现（1 = 仅当天，7 = 一周）
  zombie_days: 7 # 连续在招这么多天且 HR 不活跃/不在线，视为僵尸岗位：移出审查列表，其公司进入推荐拉黑

throttle:
  daily_limit: 30 # 每日发送上限；设为 0 表示发送量不设每日上限（一次处理多少个岗位由 automation.review_cap 决定）
  interval_min: 60
  interval_max: 180
  browse_before_greet: true
  browse_duration_min: 15
  browse_duration_max: 30
  collect_windows:
  - 08:00-23:00
  send_windows:
    - "09:00-17:00"
  day_off_probability: 0.05

ai:
  provider: "anthropic"
  service: "anthropic"           # anthropic / deepseek / doubao / custom
  model: "claude-sonnet-4-6"
  thinking: "auto"               # auto / disabled / enabled / off
  thinking_budget: 2048           # thinking=enabled 时使用，至少 1024
  timeout_seconds: 180
  scoring_max_tokens: 8192
  scoring_max_attempts: 2
  scoring_concurrency: 1          # AI评分并发数，范围1-3；数据库仍串行写入
  scoring_second_review: false    # 可选：对68-79分临界岗位进行一次独立复核
  greeting_max_tokens: 8192
  greeting_review_max_tokens: 4096
  greeting_max_attempts: 2
  # 可选：为不同任务覆盖通用 thinking 与超时设置
  # scoring_thinking_mode: "enabled"
  # scoring_timeout_seconds: 180
  # greeting_thinking_mode: "auto"
  # greeting_timeout_seconds: 180
  greeting_review_threshold: 7
  greeting_style_suggestions: false  # 可选质量提醒；只检查一次，不拒绝或自动改写文案
  resume_max_pages: 3
  # 建议在本地面板填写 api_key；它会单独保存在忽略提交的本地凭据文件中，不写入 config.yaml
  # base_url 填写后优先生效；留空时才读取对应环境变量或使用服务商默认地址
  # （ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / ARK_API_KEY / OPENAI_API_KEY）
  # api_key: "your-api-key"
  # base_url: "https://api.anthropic.com"

monitor:
  interval: 30
  # 仅“运行全流程”发送结束后生效；单独监测会立即执行首轮
  initial_cooldown_minutes: 10
  chat_url: "https://www.zhipin.com/web/geek/chat"
  max_conversations_per_cycle: 5
  max_consecutive_page_failures: 3
  max_resume_sends_per_cycle: 5
  auto_reply_hr_questions: false

follow_up:
  enabled: false
  interval_hours: 30
  skip_weekends: true

dedup:
  history_file: "./data/history.jsonl"

safety:
  daily_platform_page_limit: 1100  # 仅 BOSS：采集、投递和监测合计的页面打开硬上限
  risk_lock_minutes: 10           # 旧版 24 小时锁已取消；投递/监测风险最多短时冷却

browser:
  runtime: "builtin"
  proxy_host: "127.0.0.1"
  proxy_port: 3456
  chrome_ports: [9222, 9229, 9333]
  auto_start_proxy: true
  enable_port_guard: true
  site_patterns: true
